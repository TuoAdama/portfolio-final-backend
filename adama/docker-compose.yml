services:
  springapp:
    build: .
    platform: linux/amd64
    restart: on-failure
    develop:
      watch:
        - action: rebuild
          path: .
          target: /app
    env_file:
      - .env.local
    ports:
      - "8080:8080"
    volumes:
      - .:/home
    depends_on:
      - mysqldb


  mysqldb:
    image: mysql:8.0.39
    ports:
      - "3306:3306"
    env_file:
      - .env.local
    volumes:
      - db:/var/lib/mysql


  reverse-proxy:
    image: nginx:alpine
    depends_on:
      - springapp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl/:/etc/ssl/
      - ./nginx/conf/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/log/:/var/log/nginx/

volumes:
  db:
    name: portfolio_db


